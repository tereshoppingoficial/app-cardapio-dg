<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Painel Admin • Cardápio da Mesa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased min-h-screen pb-16">

  <!-- TOPO ADMIN -->
  <header class="sticky top-0 z-30 bg-[#111827] text-white border-b border-amber-400/30 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
      <div class="flex items-center gap-2.5">
        <span class="bg-amber-400 text-slate-950 text-xs font-black px-3 py-1 rounded-full">ADMIN</span>
        <div>
          <h1 class="text-sm sm:text-base font-black tracking-tight">Gestão do Cardápio & Pedidos da Mesa</h1>
          <p class="text-[11px] text-amber-200/80">Itens, palavras-chave, vídeos curtos, carrossel panorâmico e status</p>
        </div>
      </div>

      <a href="index.html" target="_blank"
        class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold flex items-center gap-1.5 border border-white/15">
        <i class="fa-solid fa-up-right-from-square text-amber-400"></i>
        <span>Abrir Cardápio</span>
      </a>
    </div>

    <!-- ABAS DE NAVEGAÇÃO -->
    <div class="max-w-6xl mx-auto px-4 pb-2.5 flex items-center gap-2 overflow-x-auto">
      <button type="button" onclick="switchTab('orders')" id="tabBtn-orders"
        class="px-3.5 py-1.5 rounded-xl text-xs font-black bg-amber-400 text-slate-950 whitespace-nowrap">
        <i class="fa-solid fa-bell mr-1"></i>Pedidos da Mesa
      </button>
      <button type="button" onclick="switchTab('items')" id="tabBtn-items"
        class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white/10 text-white hover:bg-white/20 whitespace-nowrap">
        <i class="fa-solid fa-utensils mr-1"></i>Itens & Palavras-Chave
      </button>
      <button type="button" onclick="switchTab('banners')" id="tabBtn-banners"
        class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white/10 text-white hover:bg-white/20 whitespace-nowrap">
        <i class="fa-solid fa-images mr-1"></i>Cabeçalho & Carrossel
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-5 space-y-6">

    <!-- ABA 1: PEDIDOS DAS MESAS -->
    <section id="section-orders" class="space-y-4">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <h2 class="text-base font-black text-slate-900">Pedidos Enviados pelas Mesas</h2>
        <div class="flex items-center gap-1.5 flex-wrap">
          <button type="button" onclick="setOrderFilter('all')" id="ordFilter-all"
            class="px-3 py-1 rounded-full text-xs font-black bg-slate-900 text-amber-400">Todos</button>
          <button type="button" onclick="setOrderFilter('novo')" id="ordFilter-novo"
            class="px-3 py-1 rounded-full text-xs font-bold bg-white border text-slate-700">Novos</button>
          <button type="button" onclick="setOrderFilter('preparo')" id="ordFilter-preparo"
            class="px-3 py-1 rounded-full text-xs font-bold bg-white border text-slate-700">Em Preparo</button>
          <button type="button" onclick="setOrderFilter('pronto')" id="ordFilter-pronto"
            class="px-3 py-1 rounded-full text-xs font-bold bg-white border text-slate-700">Prontos</button>
          <button type="button" onclick="setOrderFilter('finalizado')" id="ordFilter-finalizado"
            class="px-3 py-1 rounded-full text-xs font-bold bg-white border text-slate-700">Finalizados</button>
        </div>
      </div>

      <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="col-span-full bg-white rounded-2xl border p-10 text-center text-xs text-gray-400">
          Carregando pedidos...
        </div>
      </div>
    </section>

    <!-- ABA 2: ITENS DO CARDÁPIO + PALAVRAS-CHAVE -->
    <section id="section-items" class="hidden space-y-6">
      <form onsubmit="event.preventDefault(); saveMenuItem();" class="bg-white rounded-2xl border border-gray-200 p-4 sm:p-5 shadow-2xs space-y-4">
        <div class="flex items-center justify-between gap-2">
          <h2 id="itemFormTitle" class="text-sm sm:text-base font-black text-slate-900">Novo Item do Cardápio</h2>
          <button type="button" onclick="resetItemForm()" class="text-xs font-bold text-slate-500 hover:text-slate-900">
            Limpar campos
          </button>
        </div>

        <input type="hidden" id="editItemId" />

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Título do item *</label>
            <input type="text" id="itemTitle" required placeholder="Ex: X-Bacon Artesanal"
              class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs sm:text-sm" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Departamento / Categoria *</label>
            <select id="itemCategory" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs sm:text-sm bg-white">
              <option value="combos">Combos</option>
              <option value="promocoes">Promoções</option>
              <option value="pratos">Pratos</option>
              <option value="lanches">Lanches & Porções</option>
              <option value="bebidas">Bebidas</option>
              <option value="sobremesas">Sobremesas</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Preço (R$) *</label>
              <input type="text" id="itemPrice" required placeholder="28,90"
                class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs sm:text-sm" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Preço De (opcional)</label>
              <input type="text" id="itemOldPrice" placeholder="34,90"
                class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs sm:text-sm" />
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Descrição</label>
            <input type="text" id="itemDescription" placeholder="Ingredientes, tamanho ou detalhes..."
              class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs sm:text-sm" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">
              Palavras-chave da busca (separadas por vírgula)
            </label>
            <input type="text" id="itemKeywords" placeholder="Ex: bacon, cheddar, artesanal, combo, promoção"
              class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs sm:text-sm" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-1">
          <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
            <label class="block text-xs font-bold text-slate-800">Fotos do item (até 10 — arrastáveis no card)</label>
            <input type="file" id="itemPhotosInput" accept="image/*" multiple onchange="handleItemPhotosSelect(this)"
              class="block w-full text-xs text-slate-600" />
            <div id="itemPhotosPreview" class="flex items-center gap-2 flex-wrap pt-1"></div>
          </div>

          <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
            <label class="block text-xs font-bold text-slate-800">Vídeo curto (até 20s — visível na grade)</label>
            <input type="file" id="itemVideoInput" accept="video/*" onchange="handleItemVideoSelect(this)"
              class="block w-full text-xs text-slate-600" />
            <div id="itemVideoPreview" class="pt-1"></div>
          </div>
        </div>

        <div class="flex items-center justify-between gap-3 pt-2 flex-wrap">
          <label class="inline-flex items-center gap-2 text-xs font-bold text-slate-700 cursor-pointer">
            <input type="checkbox" id="itemAvailable" checked class="rounded text-slate-900" />
            <span>Item disponível para pedido</span>
          </label>

          <button type="submit" id="saveItemBtn"
            class="px-5 py-2.5 rounded-xl bg-[#111827] hover:bg-slate-800 text-amber-400 font-black text-xs sm:text-sm shadow-sm">
            Salvar Item no Cardápio
          </button>
        </div>
      </form>

      <div id="adminItemsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- ABA 3: CABEÇALHO & CARROSSEL PANORÂMICO -->
    <section id="section-banners" class="hidden space-y-6">
      <form onsubmit="event.preventDefault(); saveRestaurantConfig();" class="bg-white rounded-2xl border border-gray-200 p-4 sm:p-5 shadow-2xs space-y-4">
        <h2 class="text-sm sm:text-base font-black text-slate-900">Cabeçalho Principal da Vitrine</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Nome do estabelecimento</label>
            <input type="text" id="cfgStoreName" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs sm:text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Subtítulo</label>
            <input type="text" id="cfgSubtitle" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs sm:text-sm" />
          </div>
        </div>

        <div class="flex items-center gap-4 flex-wrap text-xs font-bold text-slate-700">
          <label class="inline-flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="cfgShowName" checked /> Exibir nome
          </label>
          <label class="inline-flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="cfgShowSub" checked /> Exibir subtítulo
          </label>
          <label class="inline-flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="cfgUseBanner" /> Usar imagem de banner personalizada
          </label>
        </div>

        <div class="space-y-2">
          <input type="file" id="cfgBannerFile" accept="image/*" onchange="handleHeaderBannerSelect(this)" class="block text-xs" />
          <img id="cfgBannerPreview" src="" alt="Preview Banner" class="hidden h-32 w-full max-w-md object-cover rounded-xl border" />
        </div>

        <button type="submit" class="px-4 py-2.5 rounded-xl bg-[#111827] text-amber-400 font-black text-xs sm:text-sm">
          Salvar Configuração do Cabeçalho
        </button>
      </form>

      <form onsubmit="event.preventDefault(); addPanoramaSlide();" class="bg-white rounded-2xl border border-gray-200 p-4 sm:p-5 shadow-2xs space-y-4">
        <h2 class="text-sm sm:text-base font-black text-slate-900">Novo Slide do Carrossel Panorâmico (Abaixo dos Departamentos)</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Título do slide *</label>
            <input type="text" id="slideTitle" required placeholder="Ex: Combo Família no Capricho"
              class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs sm:text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Subtítulo (opcional)</label>
            <input type="text" id="slideSubtitle" placeholder="Ex: Válido hoje direto na mesa"
              class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs sm:text-sm" />
          </div>
        </div>

        <div class="space-y-2">
          <label class="block text-xs font-bold text-slate-700">Imagem panorâmica *</label>
          <input type="file" id="slideImageInput" accept="image/*" required onchange="handleSlideImageSelect(this)" class="block text-xs" />
          <img id="slideImagePreview" src="" alt="Preview Slide" class="hidden h-28 w-full max-w-md object-cover rounded-xl border" />
        </div>

        <button type="submit" class="px-4 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs sm:text-sm">
          Adicionar Slide ao Carrossel
        </button>
      </form>

      <div id="panoramaSlidesAdminList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </section>

  </main>

  <div id="adminToast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC0wXUH9fz_ZmyqW6CAphG28LmjtkFTmOA",
      authDomain: "projeto-gold-658a1.firebaseapp.com",
      databaseURL: "https://projeto-gold-658a1-default-rtdb.firebaseio.com",
      projectId: "projeto-gold-658a1",
      storageBucket: "projeto-gold-658a1.firebasestorage.app",
      messagingSenderId: "724189004504",
      appId: "1:724189004504:web:7ec567faab926291a24dad"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let orders = [];
    let items = [];
    let slides = [];
    let currentOrderFilter = "all";
    let draftPhotos = [];
    let draftVideo = "";
    let draftHeaderBanner = "";
    let draftSlideImage = "";

    function formatBRL(val) {
      const num = parseFloat(String(val || 0).replace(/[^\d,.-]/g, "").replace(",", "."));
      return (isFinite(num) ? num : 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function showToast(msg) {
      const el = document.getElementById("adminToast");
      el.textContent = msg;
      el.classList.remove("opacity-0");
      setTimeout(() => el.classList.add("opacity-0"), 2600);
    }

    window.switchTab = function(tab) {
      ["orders", "items", "banners"].forEach(t => {
        document.getElementById(`section-${t}`).classList.toggle("hidden", t !== tab);
        const btn = document.getElementById(`tabBtn-${t}`);
        btn.className = t === tab
          ? "px-3.5 py-1.5 rounded-xl text-xs font-black bg-amber-400 text-slate-950 whitespace-nowrap"
          : "px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white/10 text-white hover:bg-white/20 whitespace-nowrap";
      });
    };

    // PEDIDOS DAS MESAS
    onValue(ref(db, "orders"), (snap) => {
      const val = snap.val();
      orders = val
        ? Object.entries(val).map(([id, v]) => ({ id, ...v })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
        : [];
      renderOrders();
    });

    window.setOrderFilter = function(filter) {
      currentOrderFilter = filter;
      ["all", "novo", "preparo", "pronto", "finalizado"].forEach(f => {
        const btn = document.getElementById(`ordFilter-${f}`);
        btn.className = f === filter
          ? "px-3 py-1 rounded-full text-xs font-black bg-slate-900 text-amber-400"
          : "px-3 py-1 rounded-full text-xs font-bold bg-white border text-slate-700";
      });
      renderOrders();
    };

    window.updateOrderStatus = async function(orderId, status) {
      await update(ref(db, `orders/${orderId}`), { status });
      showToast(`Status atualizado para: ${status.toUpperCase()}`);
    };

    function renderOrders() {
      const grid = document.getElementById("ordersGrid");
      const filtered = currentOrderFilter === "all"
        ? orders
        : orders.filter(o => o.status === currentOrderFilter);

      if (!filtered.length) {
        grid.innerHTML = `<div class="col-span-full bg-white rounded-2xl border p-8 text-center text-xs text-gray-400">Nenhum pedido neste filtro.</div>`;
        return;
      }

      const badges = {
        novo: "bg-amber-100 text-amber-900",
        preparo: "bg-blue-100 text-blue-900",
        pronto: "bg-emerald-600 text-white",
        finalizado: "bg-gray-200 text-gray-600"
      };

      grid.innerHTML = filtered.map(o => {
        const hora = o.createdAt ? new Date(o.createdAt).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "";
        return `
          <div class="bg-white rounded-2xl border border-gray-200 p-4 shadow-2xs space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div>
                <span class="bg-slate-900 text-amber-400 text-xs font-black px-2.5 py-0.5 rounded-full">Mesa ${o.tableNumber || "?"}</span>
                <p class="text-sm font-black text-slate-900 mt-1">${o.customerName || "Cliente"}</p>
                <p class="text-[11px] text-gray-500">${o.customerPhone || ""} • ${hora}</p>
              </div>
              <span class="text-[10px] font-black uppercase px-2.5 py-1 rounded-full ${badges[o.status] || 'bg-slate-100 text-slate-700'}">${o.status || "novo"}</span>
            </div>

            <div class="border-t border-gray-100 pt-2 space-y-1 text-xs">
              ${(o.items || []).map(it => `
                <div>
                  <div class="flex justify-between font-bold text-slate-800">
                    <span>${it.qty}x ${it.title}</span>
                    <span>${formatBRL((it.unitPrice || 0) * (it.qty || 1))}</span>
                  </div>
                  ${it.obs ? `<p class="text-[11px] text-amber-700 pl-3">Obs: ${it.obs}</p>` : ""}
                </div>
              `).join("")}
            </div>

            ${o.generalNote ? `<p class="text-[11px] bg-slate-50 border rounded-xl px-2.5 py-1.5 text-slate-700"><strong>Obs. geral:</strong> ${o.generalNote}</p>` : ""}

            <div class="flex items-center justify-between pt-2 border-t border-gray-100 gap-2 flex-wrap">
              <span class="text-sm font-black text-emerald-700">Total: ${formatBRL(o.total)}</span>
              <div class="flex items-center gap-1.5">
                <button type="button" onclick="updateOrderStatus('${o.id}', 'preparo')"
                  class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-800 border border-blue-200 text-[11px] font-bold">Preparo</button>
                <button type="button" onclick="updateOrderStatus('${o.id}', 'pronto')"
                  class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-[11px] font-black">Pronto</button>
                <button type="button" onclick="updateOrderStatus('${o.id}', 'finalizado')"
                  class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 border text-[11px] font-bold">Finalizar</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    // ITENS DO CARDÁPIO + PALAVRAS-CHAVE
    onValue(ref(db, "menu_items"), (snap) => {
      const val = snap.val();
      items = val ? Object.entries(val).map(([id, v]) => ({ id, ...v })) : [];
      renderAdminItems();
    });

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    window.handleItemPhotosSelect = async function(input) {
      const files = [...(input.files || [])].slice(0, 10 - draftPhotos.length);
      for (const f of files) {
        draftPhotos.push(await readFileAsDataUrl(f));
      }
      renderDraftPhotos();
    };

    window.removeDraftPhoto = function(idx) {
      draftPhotos.splice(idx, 1);
      renderDraftPhotos();
    };

    function renderDraftPhotos() {
      document.getElementById("itemPhotosPreview").innerHTML = draftPhotos.map((src, idx) => `
        <div class="relative w-14 h-14 rounded-lg overflow-hidden border">
          <img src="${src}" class="w-full h-full object-cover" />
          <button type="button" onclick="removeDraftPhoto(${idx})"
            class="absolute top-0.5 right-0.5 w-4 h-4 rounded-full bg-red-600 text-white text-[9px] flex items-center justify-center">×</button>
        </div>
      `).join("");
    }

    window.handleItemVideoSelect = async function(input) {
      const file = input.files?.[0];
      if (!file) return;
      draftVideo = await readFileAsDataUrl(file);
      renderDraftVideo();
    };

    function renderDraftVideo() {
      const box = document.getElementById("itemVideoPreview");
      if (!draftVideo) {
        box.innerHTML = "";
        return;
      }
      box.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <video src="${draftVideo}" muted controls class="h-20 rounded-lg bg-black"></video>
          <button type="button" onclick="draftVideo=''; renderDraftVideo();" class="text-xs text-red-600 font-bold">Remover vídeo</button>
        </div>
      `;
    }

    window.resetItemForm = function() {
      document.getElementById("editItemId").value = "";
      document.getElementById("itemFormTitle").textContent = "Novo Item do Cardápio";
      document.getElementById("itemTitle").value = "";
      document.getElementById("itemCategory").value = "combos";
      document.getElementById("itemPrice").value = "";
      document.getElementById("itemOldPrice").value = "";
      document.getElementById("itemDescription").value = "";
      document.getElementById("itemKeywords").value = "";
      document.getElementById("itemAvailable").checked = true;
      document.getElementById("itemPhotosInput").value = "";
      document.getElementById("itemVideoInput").value = "";
      draftPhotos = [];
      draftVideo = "";
      renderDraftPhotos();
      renderDraftVideo();
    };

    window.editMenuItem = function(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      switchTab("items");
      document.getElementById("editItemId").value = item.id;
      document.getElementById("itemFormTitle").textContent = `Editando: ${item.title}`;
      document.getElementById("itemTitle").value = item.title || "";
      document.getElementById("itemCategory").value = item.category || "combos";
      document.getElementById("itemPrice").value = item.price || "";
      document.getElementById("itemOldPrice").value = item.oldPrice || "";
      document.getElementById("itemDescription").value = item.description || "";
      document.getElementById("itemKeywords").value = item.keywords || "";
      document.getElementById("itemAvailable").checked = item.available !== false;
      draftPhotos = Array.isArray(item.photos) ? [...item.photos] : (item.imageData ? [item.imageData] : []);
      draftVideo = item.videoData || "";
      renderDraftPhotos();
      renderDraftVideo();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.saveMenuItem = async function() {
      const editId = document.getElementById("editItemId").value;
      const payload = {
        title: (document.getElementById("itemTitle").value || "").trim(),
        category: document.getElementById("itemCategory").value,
        price: (document.getElementById("itemPrice").value || "").trim(),
        oldPrice: (document.getElementById("itemOldPrice").value || "").trim(),
        description: (document.getElementById("itemDescription").value || "").trim(),
        keywords: (document.getElementById("itemKeywords").value || "").trim(),
        available: document.getElementById("itemAvailable").checked,
        photos: draftPhotos.slice(0, 10),
        imageData: draftPhotos[0] || "",
        videoData: draftVideo || "",
        updatedAt: Date.now()
      };

      if (!payload.title || !payload.price) return;

      if (editId) {
        await update(ref(db, `menu_items/${editId}`), payload);
        showToast("Item atualizado!");
      } else {
        payload.createdAt = Date.now();
        await push(ref(db, "menu_items"), payload);
        showToast("Item adicionado ao cardápio!");
      }
      resetItemForm();
    };

    window.deleteMenuItem = async function(id) {
      if (!confirm("Excluir este item do cardápio?")) return;
      await remove(ref(db, `menu_items/${id}`));
      showToast("Item removido.");
    };

    function renderAdminItems() {
      const list = document.getElementById("adminItemsList");
      if (!items.length) {
        list.innerHTML = `<div class="col-span-full bg-white rounded-2xl border p-8 text-center text-xs text-gray-400">Nenhum item cadastrado ainda.</div>`;
        return;
      }

      list.innerHTML = items.map(item => {
        const thumb = (Array.isArray(item.photos) && item.photos[0]) || item.imageData || "https://placehold.co/400x250/111827/fbbf24?text=Item";
        return `
          <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-2xs flex flex-col justify-between">
            <div>
              <div class="relative h-36 bg-slate-900">
                <img src="${thumb}" alt="${item.title}" class="w-full h-full object-cover" />
                <span class="absolute top-2 left-2 bg-black/75 text-amber-300 text-[10px] font-bold px-2 py-0.5 rounded">${item.category}</span>
                ${item.videoData ? `<span class="absolute top-2 right-2 bg-amber-400 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded">Vídeo</span>` : ""}
              </div>
              <div class="p-3.5 space-y-1.5">
                <div class="flex items-center justify-between gap-2">
                  <h3 class="font-black text-sm text-slate-900 truncate">${item.title}</h3>
                  <span class="text-xs font-black text-emerald-700">${formatBRL(item.price)}</span>
                </div>
                ${item.description ? `<p class="text-xs text-gray-500 line-clamp-2">${item.description}</p>` : ""}
                ${item.keywords ? `<p class="text-[11px] text-amber-800 font-semibold"><i class="fa-solid fa-hashtag mr-1"></i>${item.keywords}</p>` : ""}
              </div>
            </div>
            <div class="px-3.5 pb-3.5 flex items-center justify-between gap-2 pt-1">
              <span class="text-[11px] font-bold ${item.available === false ? 'text-red-600' : 'text-emerald-700'}">
                ${item.available === false ? "Esgotado" : "Disponível"}
              </span>
              <div class="flex items-center gap-1.5">
                <button type="button" onclick="editMenuItem('${item.id}')" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold">Editar</button>
                <button type="button" onclick="deleteMenuItem('${item.id}')" class="px-2.5 py-1 rounded-lg bg-red-50 text-red-600 border border-red-200 text-xs font-bold">Excluir</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    // CONFIGURAÇÃO DO CABEÇALHO & CARROSSEL PANORÂMICO
    onValue(ref(db, "restaurant_config"), (snap) => {
      if (!snap.exists()) return;
      const cfg = snap.val();
      document.getElementById("cfgStoreName").value = cfg.storeName || "";
      document.getElementById("cfgSubtitle").value = cfg.subtitle || "";
      document.getElementById("cfgShowName").checked = cfg.showStoreName !== false;
      document.getElementById("cfgShowSub").checked = cfg.showStoreSubtitle !== false;
      document.getElementById("cfgUseBanner").checked = !!cfg.useHeaderBanner;
      draftHeaderBanner = cfg.headerBannerImage || "";
      const prev = document.getElementById("cfgBannerPreview");
      if (draftHeaderBanner) {
        prev.src = draftHeaderBanner;
        prev.classList.remove("hidden");
      } else {
        prev.classList.add("hidden");
      }
    });

    window.handleHeaderBannerSelect = async function(input) {
      const f = input.files?.[0];
      if (!f) return;
      draftHeaderBanner = await readFileAsDataUrl(f);
      const prev = document.getElementById("cfgBannerPreview");
      prev.src = draftHeaderBanner;
      prev.classList.remove("hidden");
    };

    window.saveRestaurantConfig = async function() {
      await set(ref(db, "restaurant_config"), {
        storeName: (document.getElementById("cfgStoreName").value || "").trim(),
        subtitle: (document.getElementById("cfgSubtitle").value || "").trim(),
        showStoreName: document.getElementById("cfgShowName").checked,
        showStoreSubtitle: document.getElementById("cfgShowSub").checked,
        useHeaderBanner: document.getElementById("cfgUseBanner").checked,
        headerBannerImage: draftHeaderBanner
      });
      showToast("Cabeçalho salvo!");
    };

    onValue(ref(db, "panorama_banners"), (snap) => {
      const val = snap.val();
      slides = val ? Object.entries(val).map(([id, v]) => ({ id, ...v })) : [];
      renderSlidesAdmin();
    });

    window.handleSlideImageSelect = async function(input) {
      const f = input.files?.[0];
      if (!f) return;
      draftSlideImage = await readFileAsDataUrl(f);
      const prev = document.getElementById("slideImagePreview");
      prev.src = draftSlideImage;
      prev.classList.remove("hidden");
    };

    window.addPanoramaSlide = async function() {
      const title = (document.getElementById("slideTitle").value || "").trim();
      const subtitle = (document.getElementById("slideSubtitle").value || "").trim();
      if (!title || !draftSlideImage) return;

      await push(ref(db, "panorama_banners"), {
        title,
        subtitle,
        imageData: draftSlideImage,
        createdAt: Date.now()
      });

      document.getElementById("slideTitle").value = "";
      document.getElementById("slideSubtitle").value = "";
      document.getElementById("slideImageInput").value = "";
      draftSlideImage = "";
      document.getElementById("slideImagePreview").classList.add("hidden");
      showToast("Slide adicionado ao carrossel!");
    };

    window.deletePanoramaSlide = async function(id) {
      if (!confirm("Remover este slide do carrossel panorâmico?")) return;
      await remove(ref(db, `panorama_banners/${id}`));
      showToast("Slide removido.");
    };

    function renderSlidesAdmin() {
      const box = document.getElementById("panoramaSlidesAdminList");
      if (!slides.length) {
        box.innerHTML = `<div class="col-span-full bg-white rounded-2xl border p-6 text-center text-xs text-gray-400">Nenhum slide no carrossel panorâmico.</div>`;
        return;
      }

      box.innerHTML = slides.map(s => `
        <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-2xs">
          <img src="${s.imageData}" alt="${s.title}" class="w-full h-32 object-cover" />
          <div class="p-3 flex items-center justify-between gap-2">
            <div class="min-w-0">
              <p class="text-xs font-black text-slate-900 truncate">${s.title}</p>
              ${s.subtitle ? `<p class="text-[11px] text-gray-500 truncate">${s.subtitle}</p>` : ""}
            </div>
            <button type="button" onclick="deletePanoramaSlide('${s.id}')"
              class="px-2.5 py-1 rounded-lg bg-red-50 text-red-600 border border-red-200 text-xs font-bold">Excluir</button>
          </div>
        </div>
      `).join("");
    }
  </script>
</body>
</html>
